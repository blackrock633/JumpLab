project_id = "jumplab-local"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "jumplab://auth/callback"
additional_redirect_urls = ["jumplab://auth/callback"]
jwt_expiry = 900
enable_signup = true
minimum_password_length = 12
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_expiry = 600
[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30
